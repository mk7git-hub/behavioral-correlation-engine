name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check bce tests
      - name: unit and regression tests (recall and false positives)
        run: pytest -q
      - name: measure rules on labeled data
        run: |
          python -m bce.synth
          python -m bce.evaluate
          cat reports/evaluation.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: reports/
